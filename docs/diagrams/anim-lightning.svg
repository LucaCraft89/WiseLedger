<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="28.8s" repeatCount="indefinite" keyTimes="0;0.3333;0.4222" values="0;1;0"/><circle r="15" fill="#ff7a59" opacity=".25"/><circle r="8" fill="#ff7a59"/><animateMotion dur="28.8s" repeatCount="indefinite" calcMode="linear" path="M130 300 Q315 300 500 300" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.4222;1"/></g>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="28.8s" repeatCount="indefinite" keyTimes="0;0.4444;0.5333" values="0;1;0"/><circle r="15" fill="#ff7a59" opacity=".25"/><circle r="8" fill="#ff7a59"/><animateMotion dur="28.8s" repeatCount="indefinite" calcMode="linear" path="M500 300 Q685 300 870 300" keyPoints="0;0;1;1" keyTimes="0;0.4444;0.5333;1"/></g>
