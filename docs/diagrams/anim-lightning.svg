<g transform="translate(870 242)" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="28.8s" repeatCount="indefinite" keyTimes="0;0.1111;0.2222;0.3333;0.4444;0.5556;0.6667;0.7778;0.8889" values="0;0;0;0;0;1;1;1;1"/><rect x="-67" y="-11" width="134" height="22" rx="11" fill="#5db2ff"/><text y="4" font-size="11.5" font-weight="700" fill="#0a0f22" text-anchor="middle">+ TUSDT received</text></g>
