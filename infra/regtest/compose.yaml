# Local regtest for RGB (PLAN §5 path 2): bitcoind + electrs + RGB proxy. Offline, no faucet.
# Use with RGB_NETWORK=regtest (indexer tcp://127.0.0.1:50001, transport rpc://127.0.0.1:3000/json-rpc).
name: wiseledger-regtest
services:
  bitcoind:
    image: registry.gitlab.com/hashbeam/docker/bitcoind:30.2
    command: "-fallbackfee=0.0002"
    ports: ["127.0.0.1:18443:18443"]
  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.11.0
    environment:
      BTCHOST: bitcoind
    ports: ["127.0.0.1:50001:50001"]
    depends_on: [bitcoind]
  proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    ports: ["127.0.0.1:3000:3000"]
